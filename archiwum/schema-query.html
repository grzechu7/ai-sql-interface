<!-- ✅ OCHRONA: jeśli brak tokenu → redirect do login -->
<script>


  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "/login.html";
  } else {
    try {
      const payload = JSON.parse(atob(token.split(".")[1]));
      if (!payload.iss || !payload.aud) {
        localStorage.removeItem("token");
        window.location.href = "/login.html";
      }
    } catch (e) {
      localStorage.removeItem("token");
      window.location.href = "/login.html";
    }
  }


</script>

<!-- ✅ Poprawiony helper API -->
<script>
  async function apiFetch(path, options = {}) {
  let url = path.startsWith("/api/") ? path : "/api" + path;
  url = url.replace(/\/api\/api\//, "/api/");

  const token = localStorage.getItem("token");

  const headers = new Headers(options.headers || {});
  if (token) headers.set("Authorization", "Bearer " + token);
  options.headers = headers;

  const res = await fetch(url, options).catch(e => {
    console.warn("Błąd API:", e);
    throw e;
  });

  return res;
}


  async function readError(res) {
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
      const j = await res.json();
      return j.error || JSON.stringify(j);
    }
    return await res.text();
  }
</script>

<!-- 🔧 Logika strony -->
<script>
  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const info = document.getElementById('uploadResult');
    info.textContent = '⏳ Przesyłanie...';

    try {
      const fd = new FormData(e.target);
      const res = await apiFetch('/schema/upload', { method: 'POST', body: fd });
      const txt = await res.text();
      info.textContent = res.ok ? txt : ('❌ ' + txt + ' (' + res.status + ')');
      if (res.ok) loadSchemas();
    } catch {
      info.textContent = '❌ Błąd połączenia';
    }
  });

  document.getElementById('genBtn').addEventListener('click', generateSQL);
  async function generateSQL() {
    const p = document.getElementById('prompt').value.trim();
    const out = document.getElementById('sqlOutput');
    const state = document.getElementById('genState');
    if (!p) {
      state.textContent = 'Wpisz treść zapytania.';
      return;
    }
    state.textContent = '⏳ Generuję...';
    out.textContent = '';

    const res = await apiFetch('/generate-sql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: p })
    });

    if (!res.ok) {
      state.textContent = '❌ ' + (await readError(res));
      return;
    }

    const data = await res.json().catch(() => ({}));
    out.textContent = data.sql || '-- brak danych';
    state.textContent = '✅ Gotowe';
  }

  document.getElementById('refreshBtn').addEventListener('click', loadSchemas);
  async function loadSchemas() {
    const box = document.getElementById('schemasList');
    box.textContent = '⏳ Ładowanie…';

    const res = await apiFetch('/schemas');
    if (!res.ok) {
      box.textContent = '❌ ' + (await readError(res)) + ' (' + res.status + ')';
      return;
    }

    const files = await res.json();
    if (!files.length) {
      box.textContent = 'Brak plików.';
      return;
    }

    const ul = document.createElement('ul');
    ul.style.listStyle = 'none';
    ul.innerHTML = files.map(f => `
      <li style="padding:6px 0; display:flex; justify-content:space-between">
        <span>${f}</span>
        <button class="btn btn-secondary" data-del="${f}">Usuń</button>
      </li>`).join('');

    box.innerHTML = '';
    box.appendChild(ul);

    ul.querySelectorAll("button[data-del]").forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm("Usunąć ten plik?")) return;
        const res = await apiFetch('/schemas/' + btn.dataset.del, { method: 'DELETE' });
        if (!res.ok) alert('Błąd: ' + (await readError(res)));
        loadSchemas();
      });
    });
  }

  loadSchemas();
</script>
