<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | AI-SQL-Chat</title>
  <link rel="stylesheet" href="/style.css" />

  <link rel="canonical" href="https://aisql.pl/en/index.html">
<link rel="alternate" hreflang="pl" href="https://aisql.pl/index.html">
<link rel="alternate" hreflang="en" href="https://aisql.pl/en/index.html">
<link rel="alternate" hreflang="x-default" href="https://aisql.pl/en/index.html">


</head>
<body>
    <div data-include="/en/partials/header.html"></div>

  <div class="bg-grid"></div>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/en/index.html" aria-label="AI-SQL-Chat - homepage">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7c0-1.657 3.582-3 8-3s8 1.343 8 3-3.582 3-8 3-8-1.343-8-3Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4 7v10c0 1.657 3.582 3 8 3s8-1.343 8-3V7" stroke="currentColor" stroke-width="1.5"/>
          <path d="M20 12c0 1.657-3.582 3-8 3s-8-1.343-8-3" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="name">AI-SQL-Chat</span>
        <img src="/img/owner.png" alt="Owner" class="avatar" />
        <span class="byline">
          created by
          <a href="mailto:podkowa71@gmail.com" rel="author">Grzegorz Parczewski</a>
        </span>
      </a>

      <!-- Navigation -->
      <nav id="mainmenu" class="nav" role="navigation">
        <a class="link" href="/en/index.html">Home</a>
        <a class="link" href="/en/register.html">Register</a>
      </nav>
    </div>
  </header>

  <!-- ===== LOGIN FORM ===== -->
  <main class="container" style="max-width:420px;">
    <div class="card">
      <div class="card-head">
        <h2>Log in</h2>
      </div>

      <form id="loginForm">
        <input class="input mt-12" type="email" id="email" placeholder="E-mail" required />
        <input class="input mt-12" type="password" id="password" placeholder="Password" required />

        <button id="loginBtn" type="submit" class="btn btn-primary mt-16" style="width:100%;">
          Log in
        </button>
      </form>

      <p class="sub mt-16" style="text-align:center;">
        Don't have an account?
        <a href="/en/register.html" class="link" style="color:var(--accent);">Sign up</a>
      </p>

      <div class="mt-20" style="text-align:center;">
        <p class="sub" style="margin-bottom:8px;">or sign in with</p>
        <a href="/api/auth/google" class="btn btn-secondary" style="width:100%;">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="" width="18" class="btn-ico" />
          Google
        </a>
      </div>
    </div>
  </main>

  <!-- ===== LOGIN SCRIPT ===== -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("loginForm");
      const btn = document.getElementById("loginBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!email || !password) {
          alert("Enter your email and password.");
          return;
        }

        btn.disabled = true;
        btn.textContent = "⏳ Logging in...";

        try {
          // Login (passport, session cookie)
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.ok) {
            console.log("Logged in:", data.user);

            const meCheck = await fetch("/api/auth/me", {
              credentials: "include",
            });

            if (meCheck.ok) {
              window.location.replace("/en/schema-query.html");
            } else {
              alert("Session was not established correctly. Try again.");
            }
          } else {
            alert("❌ " + (data.error || "Invalid login credentials."));
          }
        } catch (err) {
          alert("❌ Server connection error.");
          console.error(err);
        } finally {
          btn.disabled = false;
          btn.textContent = "Log in";
        }
      });
    });
  </script>
  <div data-include="/en/partials/footer.html"></div>
</body>
</html>
