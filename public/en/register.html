<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | AI-SQL-Chat</title>
  <link rel="stylesheet" href="/style.css" />

<link rel="canonical" href="https://aisql.pl/en/register.html">
<link rel="alternate" hreflang="pl" href="https://aisql.pl/register.html">
<link rel="alternate" hreflang="en" href="https://aisql.pl/en/register.html">
<link rel="alternate" hreflang="x-default" href="https://aisql.pl/en/register.html">

</head>

<body>
<div data-include="/en/partials/header.html"></div>

  <div class="bg-grid"></div>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/en/index.html" aria-label="AI-SQL-Chat - home">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7c0-1.657 3.582-3 8-3s8 1.343 8 3-3.582 3-8 3-8-1.343-8-3Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4 7v10c0 1.657 3.582 3 8 3s8-1.343 8-3V7" stroke="currentColor" stroke-width="1.5"/>
          <path d="M20 12c0 1.657-3.582 3-8 3s-8-1.343-8-3" stroke="currentColor" stroke-width="1.5"/>
        </svg>

        <span class="name">AI-SQL-Chat</span>
        <img src="/img/owner.png" alt="Owner" class="avatar" />
        <span class="byline">
          created by
          <a href="mailto:podkowa71@gmail.com" rel="author">Grzegorz Parczewski</a>
        </span>
      </a>

      <!-- Navigation -->
      <nav id="mainmenu" class="nav" role="navigation">
        <a class="link" href="/en/index.html">Home</a>
        <a class="link" href="/en/login.html">Login</a>
      </nav>
    </div>
  </header>

  <!-- ===== REGISTRATION FORM ===== -->
  <main class="container" style="max-width:420px;">
    <div class="card">
      <div class="card-head">
        <h2>Create an account</h2>
      </div>

      <form id="registerForm">
        <input class="input mt-12" type="text" id="full_name" placeholder="Name or nickname (optional)" />
        <input class="input mt-12" type="email" id="email" placeholder="Email" required />
        <input class="input mt-12" type="password" id="password" placeholder="Password" required />

        <button id="registerBtn" type="submit" class="btn btn-primary mt-16" style="width:100%;">
          Register
        </button>
      </form>

      <p class="sub mt-16" style="text-align:center;">
        Already have an account?
        <a href="/en/login.html" class="link" style="color:var(--accent);">Log in</a>
      </p>

      <div class="mt-20" style="text-align:center;">
        <p class="sub" style="margin-bottom:8px;">or continue with Google</p>
        <a href="/api/auth/google" class="btn btn-secondary" style="width:100%;">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="" width="18" class="btn-ico" />
          Google
        </a>
      </div>
    </div>
  </main>

  <!-- ===== REGISTRATION SCRIPT ===== -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("registerForm");
    const registerBtn = document.getElementById("registerBtn");

    if (!form) return;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const full_name = document.getElementById("full_name").value.trim() || null;

      registerBtn.disabled = true;
      registerBtn.textContent = "Registering...";

      try {
        // STEP 1 — register
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, full_name }),
          credentials: "include"
        });

        const data = await res.json();

        if (!res.ok) {
          alert("❌ " + (data.error || "Could not create an account."));
          registerBtn.disabled = false;
          registerBtn.textContent = "Register";
          return;
        }

        console.log("Registration complete:", data);

        // STEP 2 — auto login
        const loginRes = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
          credentials: "include"
        });

        const loginData = await loginRes.json();

        if (loginRes.ok && loginData.ok) {
          console.log("Logged in automatically:", loginData);
          window.location.href = "/en/schema-query.html";
        } else {
          alert("Account created. Please log in manually.");
          window.location.href = "/en/login.html";
        }
      } catch (err) {
        console.error("Registration error:", err);
        alert("❌ Server connection error.");
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = "Register";
      }
    });
  });
  </script>
<div data-include="/en/partials/footer.html"></div>
</body>
</html>
